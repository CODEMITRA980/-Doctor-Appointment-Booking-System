groups:
- name: lumina-care-alerts
  rules:
  
  - alert: RedisCacheDown
    expr: probe_success{job="redis"} == 0
    for: 30s
    labels:
      severity: critical
    annotations:
      summary: "Redis Cache is Down"
      description: "Redis has been unreachable for more than 30 seconds. Circuit breaker should have fallen back to DB, but database load is likely increasing."

  - alert: LowCacheHitRatio
    expr: (sum(rate(cache_gets_total{result="hit"}[5m])) / sum(rate(cache_gets_total[5m]))) < 0.70
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Low Cache Hit Ratio"
      description: "Cache hit ratio has dropped below 70% over the last 5 minutes. Check for cache stampedes or misconfigured TTLs."

  - alert: HighAspectFailureRate
    expr: (sum(rate(aspect_failures_total[5m])) / sum(rate(aspect_execution_time_count[5m]))) > 0.01
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "High Aspect Failure Rate"
      description: "Over 1% of aspect interceptions (AOP) are throwing exceptions, indicating infra-level failures."
