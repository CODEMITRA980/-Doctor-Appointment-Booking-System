# Production specific configuration
spring.data.redis.host=${REDIS_HOST:redis-prod}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=1s
spring.data.redis.lettuce.pool.max-active=100
spring.data.redis.lettuce.pool.max-idle=30
spring.data.redis.lettuce.pool.min-idle=10

logging.level.com.luminacare=WARN
app.aop.execution-time.slow-method-threshold-ms=500
